# Print profiles for the Prusa Research printers.
# FORM test fixture: a few sections cut down from the real bundle's shape. Rules it exercises
# (src/libslic3r/PresetBundle.cpp flatten_configbundle_hierarchy): "inherits" is a ';' list, later parents win,
# names in *stars* are abstract and never selected.

[vendor]
name = Prusa Research
config_version = 2.3.1
config_update_url = https://files.prusa3d.com/wp-content/uploads/repository/PrusaSlicer-settings-master/live/PrusaResearch/

[printer_model:MK4S]
name = Original Prusa MK4S
variants = 0.4; 0.6
technology = FFF
family = MK4

[print:*common*]
layer_height = 0.15
perimeters = 2
fill_density = 15%
fill_pattern = gyroid
support_material = 0
compatible_printers =

[print:*0.20mm*]
inherits = *common*
layer_height = 0.2
perimeters = 4
first_layer_height = 0.2

[print:*MK4S*]
perimeters = 2
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_PRUSA3D.*/ and printer_model=="MK4S" and nozzle_diameter[0]==0.4

[print:0.20mm QUALITY @MK4S 0.4]
inherits = *0.20mm*; *MK4S*
fill_density = 15%
infill_speed = 200

[printer:*commonMK4S*]
printer_technology = FFF
printer_vendor = Prusa Research
bed_shape = 0x-4,250x-4,250x210,0x210
max_print_height = 220
nozzle_diameter = 0.4
binary_gcode = 1
gcode_flavor = marlin2
use_relative_e_distances = 1
printer_notes = Do not remove the keywords below.\nPRINTER_VENDOR_PRUSA3D\nPRINTER_MODEL_MK4S

[printer:Original Prusa MK4S 0.4 nozzle]
inherits = *commonMK4S*
printer_model = MK4S
printer_variant = 0.4
default_print_profile = 0.20mm QUALITY @MK4S 0.4
default_filament_profile = "Prusament PLA @PG"

[filament:*common*]
filament_diameter = 1.75
filament_density = 1.25
compatible_printers =

[filament:*PLA*]
inherits = *common*
filament_type = PLA
filament_density = 1.24
temperature = 215

[filament:Prusament PLA]
inherits = *PLA*
filament_cost = 24.99
filament_vendor = Prusa Polymers
compatible_printers_condition = nozzle_diameter[0]!=0.8 and printer_notes=~/.*PRINTER_VENDOR_PRUSA3D.*/

[filament:Other Printer PLA]
inherits = *PLA*
compatible_printers = "Original Prusa MINI"

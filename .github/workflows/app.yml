name: Desktop app

# Builds the FORM desktop app for macOS (Apple Silicon and Intel), Windows and Linux.
# Every push to main (stable) or dev (integration) builds and uploads the bundles as workflow artifacts.
# A tag like v12.0.0 attaches them to a draft stable release; a tag like v12.0.0-preview.1 publishes a pre-release
# for the Preview update channel. The release job (tags only) also writes the notes from the tag's CHANGELOG.md
# section, attaches SHA256SUMS and an SPDX SBOM of the source tree, and signs build provenance attestations for the
# four bundles (verify with `gh attestation verify <file> --repo kaizensx/form-studio`).
on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, os: macos-latest, asset: FORM-macos-arm64.zip }
          - { name: macOS x64, os: macos-15-intel, asset: FORM-macos-x64.zip }
          - { name: Windows x64, os: windows-latest, asset: FORM-windows-x64.zip }
          - { name: Linux x64, os: ubuntu-22.04, asset: FORM-linux-x64.tar.gz }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Linux libraries for Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 libgl1-mesa-dri xvfb
      - name: Install
        shell: bash
        env:
          UV_HTTP_TIMEOUT: "120"
        run: |
          uv venv --python 3.12 .venv
          # retried: a large wheel (cadquery-ocp) sometimes times out on the runner's network
          for i in 1 2 3; do uv pip install --python .venv -e ".[all]" pyinstaller && break
            [ "$i" = 3 ] && exit 1; echo "Install failed; retrying in 20 s."; sleep 20; done
      - name: Engine tests
        shell: bash
        run: |
          PY=.venv/bin/python; [ -f "$PY" ] || PY=.venv/Scripts/python.exe
          FORM_CONFIG=.github/ci-studio.toml FORM_DATA="$RUNNER_TEMP/form-data" "$PY" -m unittest discover -s tests
      - name: Interface loads without errors
        continue-on-error: true      # CI runners have no GPU; the 3D viewport may warn there
        shell: bash
        run: |
          PY=.venv/bin/python; [ -f "$PY" ] || PY=.venv/Scripts/python.exe
          RUN=""; [ "$RUNNER_OS" = "Linux" ] && RUN="xvfb-run -a"
          FORM_CONFIG=.github/ci-studio.toml FORM_DATA="$RUNNER_TEMP/form-data" $RUN "$PY" -m form.app --check --wait 6000
      - name: Build the app
        shell: bash
        run: |
          PY=.venv/bin/python; [ -f "$PY" ] || PY=.venv/Scripts/python.exe
          "$PY" -m PyInstaller packaging/form.spec --noconfirm
      - name: Start the packaged app
        # Proves the bundle launches on this platform: the window loads, the engine answers, the CAD kernel starts.
        # Runners have no GPU, so interface warnings are printed but do not fail the build; not starting does.
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then BIN=dist/FORM.app/Contents/MacOS/FORM
          elif [ "$RUNNER_OS" = "Windows" ]; then BIN=dist/FORM/FORM.exe
          else BIN=dist/FORM/FORM; fi
          RUN=""; [ "$RUNNER_OS" = "Linux" ] && RUN="xvfb-run -a"
          export FORM_DATA="$RUNNER_TEMP/form-smoke" FORM_CONFIG=.github/ci-studio.toml FORM_CHECK_OUT="$RUNNER_TEMP/form-check.txt"
          export FORM_NO_UPDATE_CHECK=1
          set +e
          $RUN "$BIN" --check --wait 20000
          echo "exit code: $?"
          set -e
          cat "$FORM_CHECK_OUT" || { echo "The packaged app did not reach its interface."; exit 1; }
          grep -q "^ok:" "$FORM_CHECK_OUT"
          grep -q "^kernel: build123d" "$FORM_CHECK_OUT" || { echo "The CAD kernel did not start inside the packaged app."; exit 1; }
      - name: Package
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "macOS" ]; then
            codesign --force --deep --sign - FORM.app        # ad-hoc: lets it run after "Open Anyway"; not notarized
            ditto -c -k --keepParent FORM.app "../${{ matrix.asset }}"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "../${{ matrix.asset }}" FORM
          else
            tar -czf "../${{ matrix.asset }}" FORM
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write          # create the release and attach files
      id-token: write          # sign the attestations
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: FORM-*
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        run: |
          ls -la
          test "$(find . -maxdepth 1 -name 'FORM-*' | wc -l)" -eq 4
          sha256sum FORM-* > SHA256SUMS
          cat SHA256SUMS
      - name: Build provenance attestations
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Software bill of materials
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/form-studio-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Release notes from the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/ci/release_notes.py changelog --tag "$TAG" --out "$RUNNER_TEMP/notes.md"
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # A plain tag (v12.0.0) makes a draft stable release; a tag with a suffix (v12.0.0-preview.1) a pre-release.
          if [[ "$TAG" == *-* ]]; then KIND=(--prerelease); else KIND=(--draft); fi
          VERSION="${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" dist/* --verify-tag --title "Form Studio $VERSION" --notes-file "$RUNNER_TEMP/notes.md" "${KIND[@]}"
          fi

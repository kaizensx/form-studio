name: Website

# Publishes site/ to GitHub Pages: https://kaizensx.github.io/form-studio/
# The pages are hand-written; /docs is generated from the repository's markdown by site/build.py.
# /compat/ and /bench/ show data the automation keeps on the ci-assets branch (compat.yml, bench.yml); the site is
# rebuilt from main when either of those workflows finishes, so their pages stay current without a push.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "CHANGELOG.md"
      - "README.md"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: ["Compatibility matrix", "Benchmarks", "Benchmark suites"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Benchmark suites from CI (benchmarks.yml), then /benchmarks.html from them
        run: |
          if git fetch -q --depth=1 origin ci-assets 2>/dev/null && git show FETCH_HEAD:bench/suites.json > "$RUNNER_TEMP/suites.json" 2>/dev/null; then
            cp "$RUNNER_TEMP/suites.json" docs/benchmarks/suites.json
            python -c "from form.bench.publish import publish; print(publish())"
          else
            echo "No suite results on ci-assets yet; /benchmarks.html is the committed one."
          fi
      - name: Build the docs pages
        run: |
          python -m pip install --disable-pip-version-check "markdown>=3.6,<4"
          python site/build.py
      - name: Data from CI (slicer matrix, benchmarks)
        run: |
          if git fetch -q --depth=1 origin ci-assets 2>/dev/null; then
            for pair in compat/latest.json:compat/data.json compat/history.json:compat/history.json \
                        compat/badge.json:compat/badge.json bench/history.json:bench/data.json; do
              src=${pair%%:*}; dest=site/${pair#*:}
              if git show "FETCH_HEAD:$src" > "$dest" 2>/dev/null; then echo "$dest"; else rm -f "$dest"; fi
            done
          else
            echo "No ci-assets branch yet; /compat/ and /bench/ show their empty state."
          fi
      - name: Check links, images and page weight
        run: python site/tools/check_site.py
      - name: Leave the tools out of the published site
        run: |
          mkdir _site
          rsync -a --exclude tools --exclude build.py --exclude "*.md" --exclude ".gitignore" site/ _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          include-hidden-files: true   # keep .nojekyll and any dotfiles in site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write             # publish the site
      id-token: write          # prove the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

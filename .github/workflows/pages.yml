name: Website

# Publishes site/ to GitHub Pages: https://kaizensx.github.io/form-studio/
# The home page is hand-written. The /docs pages are generated from the repository's markdown by site/build.py.
# Runs only when started by hand (Actions tab, or `gh workflow run`): the repository is private, so every run
# is billed against the owner's Actions minutes. Builds and tests also run locally before a release.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the docs pages
        run: |
          python -m pip install --disable-pip-version-check "markdown>=3.6,<4"
          python site/build.py
      - name: Check links, images and page weight
        run: python site/tools/check_site.py
      - name: Leave the tools out of the published site
        run: |
          mkdir _site
          rsync -a --exclude tools --exclude build.py --exclude "*.md" --exclude ".gitignore" site/ _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

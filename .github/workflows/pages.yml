name: Website

# Publishes site/ to GitHub Pages: https://kaizensx.github.io/form-studio/
# The pages are hand-written; /docs is generated from the repository's markdown by site/build.py, and
# /recipes/index.json (read by the app's community recipe browser) by site/tools/build_recipe_index.py.
# /compat/ and /bench/ show data the automation keeps on the ci-assets branch (compat.yml, bench.yml); the site is
# rebuilt from main when either of those workflows finishes, so their pages stay current without a push.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "CHANGELOG.md"
      - "README.md"
      - "community/**"
      - "form/recipes/**"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: ["Compatibility matrix", "Benchmarks"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the docs pages
        run: |
          python -m pip install --disable-pip-version-check "markdown>=3.6,<4"
          python site/build.py
      - name: Build the recipe index
        run: python site/tools/build_recipe_index.py
      - name: Data from CI (slicer matrix, benchmarks)
        run: |
          if git fetch -q --depth=1 origin ci-assets 2>/dev/null; then
            for pair in compat/latest.json:compat/data.json compat/history.json:compat/history.json \
                        compat/badge.json:compat/badge.json bench/history.json:bench/data.json; do
              src=${pair%%:*}; dest=site/${pair#*:}
              if git show "FETCH_HEAD:$src" > "$dest" 2>/dev/null; then echo "$dest"; else rm -f "$dest"; fi
            done
          else
            echo "No ci-assets branch yet; /compat/ and /bench/ show their empty state."
          fi
      - name: Check links, images and page weight
        run: python site/tools/check_site.py
      - name: Leave the tools out of the published site
        run: |
          mkdir _site
          rsync -a --exclude tools --exclude build.py --exclude "*.md" --exclude ".gitignore" site/ _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

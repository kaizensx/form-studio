name: Dependency review

# On every pull request: lists the dependencies it adds, removes or changes (Python packages and GitHub Actions) and
# fails when one of them brings a known vulnerability of high or critical severity, or a licence that cannot ship in
# an MIT app. Uses the repository's dependency graph; nothing leaves GitHub.
on:
  pull_request:

permissions: {}

concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write     # the summary comment, posted only when something fails
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, SSPL-1.0
          comment-summary-in-pr: on-failure
          show-openssf-scorecard: true
          warn-on-openssf-scorecard-level: 3

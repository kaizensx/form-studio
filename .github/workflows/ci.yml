name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Environment
        env:
          UV_HTTP_TIMEOUT: "120"
        run: |
          uv venv --python 3.12 .venv
          # retried: a large wheel (cadquery-ocp) sometimes times out on the runner's network
          for i in 1 2 3; do uv pip install --python .venv/bin/python -r requirements.lock && break
            [ "$i" = 3 ] && exit 1; echo "Install failed; retrying in 20 s."; sleep 20; done
          uv pip install --python .venv/bin/python --no-deps -e .
      - name: Tests (no slicer on CI runners; slicing tests skip)
        env:
          FORM_CONFIG: ${{ github.workspace }}/.github/ci-studio.toml
          COVERAGE_CORE: sysmon      # Python 3.12's low-overhead monitoring
          OS: ${{ matrix.os }}
        run: |
          # Linux measures line coverage of the engine (settings in pyproject.toml); macOS runs the tests plainly.
          if [ "$OS" = "ubuntu-latest" ]; then
            uv pip install --python .venv/bin/python "coverage==7.17.4"
            .venv/bin/python -m coverage run -m unittest discover -s tests -v
          else
            .venv/bin/python -m unittest discover -s tests -v
          fi
      - name: Coverage summary
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        run: |
          .venv/bin/python -m coverage combine -q || true
          [ -f .coverage ] || { echo "No coverage data (the tests did not get far enough)."; exit 0; }
          {
            echo "### Test coverage (engine, line coverage)"
            echo
            .venv/bin/python -m coverage report --format=total | sed 's/^/**Total: /; s/$/%**/'
            echo
            echo "<details><summary>Per file</summary>"
            echo
            .venv/bin/python -m coverage report --format=markdown --sort=cover
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          .venv/bin/python -m coverage xml -q -o coverage.xml
      - name: Keep the coverage report
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' && hashFiles('coverage.xml') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.xml
          retention-days: 14
      - name: MCP reference is up to date
        run: |
          .venv/bin/python scripts/gen_mcp_docs.py
          git diff --exit-code docs/MCP.md

  automation:
    name: Workflows and automation scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The automation's own tests (fixtures, no network)
        run: python3 scripts/ci/selftest.py
      - name: actionlint (with shellcheck)
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "$SHA256  actionlint.tgz" | sha256sum -c -
          tar -xzf actionlint.tgz actionlint
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/actionlint" -color -ignore 'SC2012'

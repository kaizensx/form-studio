name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Environment
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -r requirements.lock
          uv pip install --python .venv/bin/python --no-deps -e .
      - name: Tests (no slicer on CI runners; slicing tests skip)
        env:
          FORM_CONFIG: ${{ github.workspace }}/.github/ci-studio.toml
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: MCP reference is up to date
        run: |
          .venv/bin/python scripts/gen_mcp_docs.py
          git diff --exit-code docs/MCP.md

  automation:
    name: Workflows and automation scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: The automation's own tests (fixtures, no network)
        run: python3 scripts/ci/selftest.py
      - name: actionlint (with shellcheck)
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "$SHA256  actionlint.tgz" | sha256sum -c -
          tar -xzf actionlint.tgz actionlint
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/actionlint" -color -ignore 'SC2012'

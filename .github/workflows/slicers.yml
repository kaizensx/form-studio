name: Real slicers

# Every slicer FORM drives, run for real on Windows and Linux: the official build of a pinned version is installed
# on the runner and never opened; FORM finds it, resolves the pinned presets from the profiles inside the program,
# slices the example dock, and reads time, grams and layers back from that G-code. A job fails unless a real slice
# exists. (PrusaSlicer runs in ui.yml; Bambu Studio and OrcaSlicer on macOS are run on a real Mac.)
# Runs only when started by hand (Actions tab, or `gh workflow run`): the repository is private, so every run
# is billed against the owner's Actions minutes. Builds and tests also run locally before a release.
on:
  workflow_dispatch:

jobs:
  slice:
    name: ${{ matrix.slicer }} ${{ matrix.version }} on ${{ matrix.on }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # reports: the version the program states, which the slice must carry.
          # url: the asset of the official release. sha256: the digest GitHub publishes for that asset
          # SuperSlicer 2.5.59.13 predates asset digests and upstream publishes no checksum, so its two are the
          # digests of the files as first downloaded here on 2026-11-17: they pin the file, they are not upstream's word.
          - slicer: OrcaSlicer
            kind: orca
            version: 2.5.1
            reports: "2.5.1"
            on: Linux
            os: ubuntu-24.04
            dir: OrcaSlicer
            url: https://github.com/OrcaSlicer/OrcaSlicer/releases/download/v2.5.1/OrcaSlicer_Linux_AppImage_Ubuntu2404_V2.5.1.AppImage
            sha256: 073b8105c928356141db0ddbce88b81d52c7a9e2442f9baae0a9089c89ff04eb
          - slicer: OrcaSlicer
            kind: orca
            version: 2.5.1
            reports: "2.5.1"
            on: Windows
            os: windows-latest
            dir: OrcaSlicer
            url: https://github.com/OrcaSlicer/OrcaSlicer/releases/download/v2.5.1/OrcaSlicer_Windows_V2.5.1_x64_portable.zip
            sha256: f73194789c9a114974e3587f646bb627fa69c7686d949bf040fdb710c41515e8
          - slicer: Bambu Studio
            kind: bambu
            version: 2.9.1.70
            reports: "02.09.01.70"
            on: Linux
            os: ubuntu-24.04
            dir: BambuStudio
            url: https://github.com/bambulab/BambuStudio/releases/download/v02.09.01.70/BambuStudio_ubu24-v02.09.01.70-20261103183404.AppImage
            sha256: 668dabb1be53c758189ed6bc89935285dea5e0af46216546b1bafd6882e9aff0
          - slicer: Bambu Studio
            kind: bambu
            version: 2.9.1.70
            reports: "02.09.01.70"
            on: Windows
            os: windows-latest
            dir: Bambu Studio
            url: https://github.com/bambulab/BambuStudio/releases/download/v02.09.01.70/Bambu_Studio_win-v02.09.01.70-20261103183404.zip
            sha256: a4c0d5f94109cb2c2c07fb02ca1f740e96b586fbf3ae557a1647eeb5503a15b8
          - slicer: SuperSlicer
            kind: superslicer
            version: 2.5.59.13
            reports: "2.5.59.13"
            on: Linux
            os: ubuntu-22.04
            dir: SuperSlicer
            url: https://github.com/supermerill/SuperSlicer/releases/download/2.5.59.13/SuperSlicer-ubuntu_20.04-2.5.59.13.AppImage
            sha256: 332dfbb7046fc12c1936900be2a85ce0f13031b381edf266f8c6d08d94730da4
          - slicer: SuperSlicer
            kind: superslicer
            version: 2.5.59.13
            reports: "2.5.59.13"
            on: Windows
            os: windows-latest
            dir: SuperSlicer
            url: https://github.com/supermerill/SuperSlicer/releases/download/2.5.59.13/SuperSlicer_2.5.59.13_win64_240701.zip
            sha256: aefc6d051b3b3e6e1d1a571d66cb267a09d7cfbe2d8f889a433cd8ac5f787a69
          - slicer: QIDISlicer
            kind: qidi
            version: 1.2.5
            reports: "1.2.5"
            on: Linux
            os: ubuntu-24.04
            dir: QIDISlicer
            url: https://github.com/QIDITECH/QIDISlicer/releases/download/V1.2.5/QIDISlicer_1.2.5_Ubuntu24.AppImage
            sha256: 4c78c03f4711ac6d7356753c9e7f2cf2e884b2c98e5326231368f8ba839b320f
          - slicer: QIDISlicer
            kind: qidi
            version: 1.2.5
            reports: "1.2.5"
            on: Windows
            os: windows-latest
            dir: QIDISlicer
            url: https://github.com/QIDITECH/QIDISlicer/releases/download/V1.2.5/QIDISlicer_1.2.5_Win64.zip
            sha256: b95bd1a2811418d1baef886f919edf891043edd62077944eb5d89538973d76d5
    env:
      FORM_CONFIG: .github/ci-${{ matrix.kind }}.toml
      FORM_NO_UPDATE_CHECK: 1
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Linux libraries (Qt for FORM, a virtual screen and GTK/GL for the slicer)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglu1-mesa libgl1-mesa-dri libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libgtk-3-0 libwebkit2gtk-4.1-0 libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 xvfb
      - name: Install FORM
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv -e ".[all]"
      - name: Install ${{ matrix.slicer }} ${{ matrix.version }} (official release, never opened)
        shell: bash
        env:
          URL: ${{ matrix.url }}
          SHA256: ${{ matrix.sha256 }}
          DIR: ${{ matrix.dir }}
        run: |
          cd "$RUNNER_TEMP"
          curl -fL --retry 5 --retry-all-errors -o slicer.pkg "$URL"
          sha256sum slicer.pkg
          echo "$SHA256  slicer.pkg" | sha256sum -c -
          if [ "$RUNNER_OS" = "Linux" ]; then
            # Unpacked, not mounted: runners have no FUSE. FORM starts the AppRun inside.
            chmod +x slicer.pkg
            ./slicer.pkg --appimage-extract > /dev/null
            sudo mv squashfs-root "/opt/$DIR"
            DEST="/opt/$DIR"
          else
            7z x -y -o"unpacked" slicer.pkg > /dev/null
            SRC=unpacked
            if [ "$(ls -A unpacked | wc -l)" = "1" ] && [ -d "unpacked/$(ls -A unpacked)" ]; then SRC="unpacked/$(ls -A unpacked)"; fi
            DEST="/c/Program Files/$DIR"
            mkdir -p "$DEST"
            cp -r "$SRC"/. "$DEST"/
          fi
          echo "--- layout of $DEST"
          ls -la "$DEST" | head -60
          find "$DEST" -maxdepth 6 -type d -name profiles
          find "$DEST" -maxdepth 4 \( -iname '*slicer*' -o -iname '*studio*' -o -name AppRun \) -not -name '*.png' -not -name '*.svg' -not -name '*.ico' | head -40
      - name: What FORM found
        shell: bash
        run: |
          PY=.venv/bin/python; [ -f "$PY" ] || PY=.venv/Scripts/python.exe
          RUN=""; [ "$RUNNER_OS" = "Linux" ] && RUN="xvfb-run -a"
          $RUN "$PY" -c "import json; from form import config, slicer; r = slicer.public(slicer.resolve(config.load())); print(json.dumps(r, indent=1)); raise SystemExit(0 if r.get('available') else 1)"
          APP="$("$PY" -c "from form import config, slicer; print(slicer.resolve(config.load())['app'])")"
          echo "--- $APP --help"
          ($RUN "$APP" --help 2>&1 || true) | head -n 6 || true
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -NoProfile -Command "Get-ChildItem (Split-Path '$APP') -File | Where-Object { \$_.Name -match '(slicer|studio|slic3r).*\.(exe|dll)\$' } | ForEach-Object { '{0}: ProductVersion={1} FileVersion={2}' -f \$_.Name, \$_.VersionInfo.ProductVersion, \$_.VersionInfo.FileVersion }"
          fi
      - name: FORM slices with it
        # Fails unless the slice exists and carries layers, time, grams and the version the program reports.
        shell: bash
        env:
          REPORTS: ${{ matrix.reports }}
        run: |
          PY=.venv/bin/python; [ -f "$PY" ] || PY=.venv/Scripts/python.exe
          RUN=""; [ "$RUNNER_OS" = "Linux" ] && RUN="xvfb-run -a"
          export FORM_DATA="$RUNNER_TEMP/form-slice"
          mkdir -p "$RUNNER_TEMP/out"
          "$PY" -m form examples add
          $RUN "$PY" -m form run hallway-phone-dock
          "$PY" -m form state hallway-phone-dock > "$RUNNER_TEMP/state.json"
          "$PY" -c "import sys,json; s=json.load(open(sys.argv[1],encoding='utf-8')).get('slice_simulated') or {}; print('sliced:', {k:s.get(k) for k in ('time_min','filament_g','layers','slicer','presets')}); sys.exit(0 if s.get('layers') and s.get('time_min') and s.get('filament_g') and s.get('slicer') == sys.argv[2] else 1)" "$RUNNER_TEMP/state.json" "$REPORTS"
          "$PY" -m form simulate hallway-phone-dock --png "$RUNNER_TEMP/out/toolpaths.png"
          test -s "$RUNNER_TEMP/out/toolpaths.png"
          "$PY" -m form cost hallway-phone-dock
      - name: The slicer's own log
        if: always()
        shell: bash
        run: |
          find "$RUNNER_TEMP/form-slice" -name slicer.log 2>/dev/null | while read -r f; do echo "=== $f"; tail -n 60 "$f"; done
          find "$RUNNER_TEMP/form-slice" -name '*.gcode' 2>/dev/null | while read -r f; do echo "=== $f"; head -c 300 "$f" | head -n 6; grep -a -m 24 -iE "^; ?(generated|estimated|total|filament used|model printing|max_z)" "$f" | cut -c1-200; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slice-${{ matrix.kind }}-${{ matrix.on }}
          path: ${{ runner.temp }}/out
          if-no-files-found: ignore

name: Interface tests

# Uses the app the way a person does, on every platform: each journey in tests/journeys/ runs in the real window with
# synthetic mouse and key events and asserts outcomes in the engine. Runners have no GPU; Qt renders in software.
# Windows and Linux only: a macOS runner has no foreground window session, so pop-up menus never open there; the
# same journeys run on a real Mac before each release.
# On dev, the Linux screenshots also become the baselines that PR preview compares pull requests with
# (ci-assets branch, ui/baseline/).
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The journeys run in three shards per system (every third one, by name, so a journey and its small-window and
  # light variants land in different shards): all of them in one job had grown past its 45 minutes.
  journeys:
    name: ${{ matrix.name }} (${{ matrix.shard }}/3)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        name: [Windows x64, Linux x64]
        shard: [1, 2, 3]
        include:
          - { name: Windows x64, os: windows-latest }
          - { name: Linux x64, os: ubuntu-22.04 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Linux libraries for Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 libgl1-mesa-dri xvfb
      - name: Install
        shell: bash
        env:
          UV_HTTP_TIMEOUT: "120"
        run: |
          uv venv --python 3.12 .venv
          # retried: a large wheel (cadquery-ocp) sometimes times out on the runner's network
          for i in 1 2 3; do uv pip install --python .venv -e ".[all]" && break
            [ "$i" = 3 ] && exit 1; echo "Install failed; retrying in 20 s."; sleep 20; done
      - name: Install PrusaSlicer
        # A real slicer on every platform, so the journeys slice, simulate and release for real.
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then for i in 1 2 3 4; do choco install prusaslicer -y --no-progress && break; echo "Chocolatey failed (attempt $i), retrying"; sleep $((i * 20)); done
          else sudo apt-get install -y prusa-slicer; fi
      - name: FORM finds the slicer and slices
        shell: bash
        run: |
          PY=.venv/bin/python; [ -f "$PY" ] || PY=.venv/Scripts/python.exe
          export FORM_CONFIG=.github/ci-prusa.toml FORM_DATA="$RUNNER_TEMP/form-slice"
          "$PY" -m form new "Hallway phone dock" dock --purpose print > /dev/null
          "$PY" -m form run hallway-phone-dock
          "$PY" -m form state hallway-phone-dock > "$RUNNER_TEMP/state.json"
          "$PY" -c "import sys,json; s=json.load(open(sys.argv[1],encoding='utf-8')).get('slice_simulated') or {}; print('sliced:', {k:s.get(k) for k in ('time_s','filament_g','layers','slicer','slicer_version')}); sys.exit(0 if s.get('layers') else 1)" "$RUNNER_TEMP/state.json"
          "$PY" -m form cost hallway-phone-dock
      - name: A screen large enough for the window
        # Windows runners start at 1024x768, which clips the 1440x900 window the journeys ask for.
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Use the app
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          PY=.venv/bin/python; [ -f "$PY" ] || PY=.venv/Scripts/python.exe
          RUN=""; [ "$RUNNER_OS" = "Linux" ] && RUN="xvfb-run -a -s '-screen 0 1920x1200x24'"
          export FORM_UI_TESTS=1 FORM_UI_SHOTS="$RUNNER_TEMP/ui-shots" FORM_UI_STUDIO_TOML="$PWD/.github/ci-prusa.toml" FORM_NO_UPDATE_CHECK=1
          TESTS=$("$PY" scripts/ci/ui_shards.py --shards 3 --index "$SHARD" | tr -d '\r')
          echo "$TESTS" | tr ' ' '\n'
          eval "$RUN" '"$PY" -m unittest -v $TESTS'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ui-shots-${{ matrix.name }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/ui-shots
          if-no-files-found: ignore

  baseline:
    name: Screenshot baselines
    needs: journeys
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write          # the ci-assets branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: ui-shots-Linux x64-*
          merge-multiple: true
          path: ${{ runner.temp }}/shots
      - name: Keep the Linux screenshots as baselines
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          N=$(find "$RUNNER_TEMP/shots" -maxdepth 1 -name '*.png' ! -name 'fail-*' 2>/dev/null | wc -l)
          echo "$N screenshots"
          if [ "$N" -lt 3 ]; then echo "Too few screenshots to replace the baselines."; exit 0; fi
          python3 scripts/ci/assets.py put --src "$RUNNER_TEMP/shots" --dest ui/baseline --replace --exclude fail- \
            --message "Interface baselines from dev ${GITHUB_SHA::10}"

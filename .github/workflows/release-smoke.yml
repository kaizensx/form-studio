name: Release smoke test

# Every night, the latest published release is downloaded the way a person downloads it, checked against its
# SHA256SUMS (when the release has one) and used on all four platforms with scripts/smoke_packaged.py: the window
# opens, the CAD kernel starts, a design is built and checked, the app's own MCP server answers. When it fails, one
# issue is opened (or updated) with the results; it is closed again by the next passing night.
# Run it by hand with channel "preview" to test the newest pre-release instead.
on:
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: Which release
        type: choice
        options: [stable, preview]
        default: stable

permissions: {}

concurrency:
  group: release-smoke-${{ inputs.channel || 'stable' }}
  cancel-in-progress: true

jobs:
  smoke:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, os: macos-latest, asset: FORM-macos-arm64.zip, app: Form Studio.app }
          - { name: macOS x64, os: macos-15-intel, asset: FORM-macos-x64.zip, app: Form Studio.app }
          - { name: Windows x64, os: windows-latest, asset: FORM-windows-x64.zip, app: FORM/FORM.exe }
          - { name: Linux x64, os: ubuntu-22.04, asset: FORM-linux-x64.tar.gz, app: FORM/FORM }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Linux libraries for Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 libgl1-mesa-dri xvfb
      - name: Download the release
        id: dl
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel || 'stable' }}
          ASSET: ${{ matrix.asset }}
        run: |
          if [ "$CHANNEL" = "preview" ]; then
            TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" --jq '[.[] | select(.prerelease and (.draft | not))][0].tag_name')
          else
            TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          fi
          [ -n "$TAG" ] && [ "$TAG" != "null" ] || { echo "No $CHANNEL release found."; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/rel" && cd "$RUNNER_TEMP/rel"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "$ASSET"
          if gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p SHA256SUMS 2>/dev/null; then
            grep " $ASSET\$" SHA256SUMS > mine.txt
            if command -v sha256sum >/dev/null; then sha256sum -c mine.txt; else shasum -a 256 -c mine.txt; fi
          else
            echo "$TAG has no SHA256SUMS; skipping the checksum."
          fi
          case "$ASSET" in
            *.zip) if [ "$RUNNER_OS" = "macOS" ]; then ditto -x -k "$ASSET" .; else 7z x -y "$ASSET" > /dev/null; fi ;;
            *.tar.gz) tar -xzf "$ASSET" ;;
          esac
          ls -la
      - name: Use the released app
        shell: bash
        env:
          APP: ${{ matrix.app }}
        run: |
          RUN=""; [ "$RUNNER_OS" = "Linux" ] && RUN="xvfb-run -a"
          A="$RUNNER_TEMP/rel/$APP"; [ -e "$A" ] || A="$RUNNER_TEMP/rel/FORM.app"   # releases before 1.1 shipped FORM.app
          $RUN uv run --no-project --python 3.12 --with "mcp>=2.3,<3" python scripts/smoke_packaged.py "$A" \
            | tee "$RUNNER_TEMP/smoke.txt"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-${{ matrix.asset }}
          path: ${{ runner.temp }}/smoke.txt
          retention-days: 14
          if-no-files-found: ignore

  report:
    needs: smoke
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.smoke.result }}
        run: |
          TITLE="The released app failed its nightly smoke test"
          NUM=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$RESULT" = "failure" ]; then
            BODY="The latest release did not pass scripts/smoke_packaged.py on at least one platform. The results of each platform are in the [workflow run]($RUN_URL).

          — Form Studio automation"
            if [ -n "$NUM" ]; then gh issue comment "$NUM" --body "Still failing: [run]($RUN_URL). — Form Studio automation"
            else gh issue create --title "$TITLE" --body "$BODY" --label "type:bug"; fi
          elif [ "$RESULT" = "success" ] && [ -n "$NUM" ]; then
            gh issue close "$NUM" --comment "The released app passes its smoke test again: [run]($RUN_URL). — Form Studio automation"
          fi

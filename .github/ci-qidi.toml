# Real slicers in CI (.github/workflows/slicers.yml): QIDISlicer is installed on the runner but never opened, so the
# presets are pinned here and FORM reads them from the profiles shipped inside the program.
[printer]
name = "QIDI Q1 Pro"
envelope_mm = [245, 245, 240]

[slicer]
kind = "qidi"
machine = "Q1 Pro 0.4 nozzle"
process = "0.20mm Fine @Q1 Pro 0.4 nozzle"
filament = "Generic PLA @Q1 Pro 0.4 nozzle"

# Weekly dependency updates, as grouped pull requests against dev (where all work lands first).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7          # let a new release settle for a week before it is proposed
    groups:
      # minor and patch releases of actions together, in one pull request that can merge itself once CI passes
      # (dependabot-auto-merge.yml); a major release comes on its own, for a person to read
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "CI:"
  - package-ecosystem: pip
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7          # let a new release settle for a week before it is proposed
    open-pull-requests-limit: 5
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # The CAD kernel and its bindings are pinned on purpose; they move with a tested release.
      - dependency-name: build123d
      - dependency-name: cadquery-ocp*
      - dependency-name: bd_warehouse
      - dependency-name: py_gearworks
    commit-message:
      prefix: "Dependencies:"

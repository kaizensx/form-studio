name: Bug report
description: Something in Form Studio did not work as it should.
title: "[Bug] "
labels: ["type:bug", "status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. A clear report is usually fixed fastest.
        For questions and setup help, please use [Discussions › Q&A](https://github.com/kaizensx/form-studio/discussions/categories/q-a) instead.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Desktop app (window, viewport, sheets)
        - Conversations and agents
        - Design, revisions and recipes
        - Checks, fit and analysis
        - Slicing and print simulation
        - Release, export and import
        - Installer and first start
        - CLI or MCP server
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what Form Studio did instead. Screenshots are welcome.
      placeholder: |
        1. Opened the phone dock and pressed "Watch it print"
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Form Studio version
      description: Shown in About, or as "current" in `form update --check`.
      placeholder: "11.1.1"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows 11
        - Windows 10
        - Linux
    validations:
      required: true
  - type: input
    id: tools
    attributes:
      label: Agent and slicer
      description: The agent and model, and the slicer and printer, if they were involved.
      placeholder: "Claude Code · Opus, OrcaSlicer 2.5.1 · Bambu Lab A1 mini"
  - type: textarea
    id: doctor
    attributes:
      label: "`form setup --check` output"
      description: Optional, but it tells us what Form Studio found on your computer. Home folder paths can be removed.
      render: json
  - type: textarea
    id: logs
    attributes:
      label: Logs or error text
      render: text

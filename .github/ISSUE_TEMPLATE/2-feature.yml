name: Feature request
description: Suggest a capability or an improvement.
title: "[Feature] "
labels: ["type:feature", "status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        Early ideas are best discussed in [Discussions › Ideas](https://github.com/kaizensx/form-studio/discussions/categories/ideas) first.
        Open an issue here when the request is concrete enough to build.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to make or do, and where does Form Studio get in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: How it could work, in the app, the CLI or over MCP.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Desktop app
        - Agents and conversations
        - Design and recipes
        - Checks and analysis
        - Slicers and printers
        - CLI and MCP
        - Website and docs
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have tried
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I would like to help build this.

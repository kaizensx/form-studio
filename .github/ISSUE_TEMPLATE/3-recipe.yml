name: New recipe
description: Propose a parametric object family, or submit one for the community gallery.
title: "[Recipe] "
labels: ["area:recipes", "status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        A recipe is a family of objects: typed parameters in, one valid solid out. See
        [Writing a recipe](https://kaizensx.github.io/form-studio/docs/recipes.html) and the
        [community gallery format](https://github.com/kaizensx/form-studio/tree/main/community/recipes).

        **Submitting a recipe you wrote?** Choose "build and check it here" and paste the file below, link to it, or
        attach it (`recipe.py` renamed to `recipe.py.txt`, a `.zip`, or a `.formstudio` file renamed to `.zip`).
        Form Studio's automation builds it in the CAD kernel at its defaults and two other parameter sets, runs the
        checks, slices it with PrusaSlicer and replies here with pictures and results. Edit the issue to check again.

        Submitting from Form Studio (**Share › Share to the community**) fills in the fields below. Drag `preview.png`
        from the submission folder it saved into the Preview box, then submit.
  - type: dropdown
    id: kind
    attributes:
      label: This is
      options:
        - A request for a recipe
        - "A recipe I wrote: build and check it here"
        - A recipe I wrote and will submit as a pull request
    validations:
      required: true
  - type: textarea
    id: object
    attributes:
      label: The object
      description: What it is for and what it holds, attaches to or fits. Sketches and photos help.
    validations:
      required: true
  - type: textarea
    id: params
    attributes:
      label: Parameters
      description: Which dimensions are measured facts (brief), which are interfaces, which are free choices (form).
      placeholder: |
        brief: phone width, phone thickness
        interface: clearance per side
        form: wall, lean angle, corner radius
  - type: textarea
    id: failure
    attributes:
      label: How it could fail
      description: Tip over, snap, not fit, warp, need support. These become the recipe's checks.
  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - Python (build123d)
        - OpenSCAD
        - Either
  - type: input
    id: recipe_id
    attributes:
      label: Recipe id
      description: "For a submission: the gallery folder name, lowercase letters, digits and hyphens."
      placeholder: cable-clip
  - type: input
    id: tags
    attributes:
      label: Tags
      description: "For a submission: a few lowercase words people would search for, separated by commas."
      placeholder: desk, cable management, snap fit
  - type: textarea
    id: recipe_meta
    attributes:
      label: meta.json
      description: "For a submission: what the gallery shows. Form Studio fills this in from the recipe."
  - type: textarea
    id: recipe_code
    attributes:
      label: Recipe source
      description: "For a submission: the whole recipe.py (one Recipe subclass) or recipe.scad, in a code block. If it is too long, drag the file here."
  - type: input
    id: link
    attributes:
      label: Link to the recipe file
      description: "Instead of pasting: a link to the file on GitHub or in a gist."
      placeholder: https://github.com/you/your-repo/blob/main/recipe.py
  - type: textarea
    id: preview
    attributes:
      label: Preview
      description: "Optional: drag preview.png from the saved submission folder here (the part at its default values)."

name: New recipe
description: Propose a parametric object family, or submit one for the community gallery.
title: "[Recipe] "
labels: ["area:recipes", "status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        A recipe is a family of objects: typed parameters in, one valid solid out. See
        [Writing a recipe](https://kaizensx.github.io/form-studio/docs/recipes.html) and the
        [community gallery format](https://github.com/kaizensx/form-studio/tree/main/community/recipes).

        Submitting from Form Studio (**Share › Share to the community**) fills in the fields below. Drag `preview.png`
        from the submission folder it saved into the Preview box, choose **This is**, then submit.
  - type: dropdown
    id: kind
    attributes:
      label: This is
      options:
        - A request for a recipe
        - A recipe I wrote and will submit as a pull request
        - A recipe I am submitting for the community gallery
    validations:
      required: true
  - type: textarea
    id: object
    attributes:
      label: The object
      description: What it is for and what it holds, attaches to or fits. Sketches and photos help.
    validations:
      required: true
  - type: textarea
    id: params
    attributes:
      label: Parameters
      description: Which dimensions are measured facts (brief), which are interfaces, which are free choices (form).
      placeholder: |
        brief: phone width, phone thickness
        interface: clearance per side
        form: wall, lean angle, corner radius
  - type: textarea
    id: failure
    attributes:
      label: How it could fail
      description: Tip over, snap, not fit, warp, need support. These become the recipe's checks.
  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - Python (build123d)
        - OpenSCAD
        - Either
  - type: input
    id: recipe_id
    attributes:
      label: Recipe id
      description: The folder name under community/recipes/. Lowercase letters, digits and hyphens.
      placeholder: cable-clip
  - type: textarea
    id: recipe_meta
    attributes:
      label: meta.json
      description: What the gallery shows. Form Studio fills this in from the recipe.
  - type: textarea
    id: recipe_code
    attributes:
      label: Recipe code
      description: The whole recipe.py or recipe.scad. If it is too long for the link, drag the file here.
  - type: textarea
    id: preview
    attributes:
      label: Preview
      description: Drag preview.png from the saved submission folder here (about 960 × 560, the part at its default values).

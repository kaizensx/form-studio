name: Bug
description: Something FORM did wrong
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened
      description: Include the tool or command, its output, and what you expected.
    validations: {required: true}
  - type: textarea
    attributes:
      label: "`form setup --check` output"
      render: json
  - type: input
    attributes:
      label: Agent and version
      placeholder: Claude Code 2.1 / Codex 0.164 / Gemini CLI / Cursor / CLI only

name: Recipe request
description: An object family FORM should be able to design
labels: [recipe]
body:
  - type: textarea
    attributes:
      label: The object
      description: What is it for, and what does it attach to or hold? Sketches and photos help.
    validations: {required: true}
  - type: textarea
    attributes:
      label: Dimensions that matter
      description: Which ones you would measure (the brief), which ones are interfaces, which are free choices.
  - type: textarea
    attributes:
      label: How it could fail
      description: Tip over, snap, not fit, warp... This becomes the recipe's checks.

body:
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Your setup
      description: Form Studio version, operating system, agent and slicer.
      placeholder: "1.0.0 · Windows 11 · Codex · OrcaSlicer 2.5.1"
  - type: textarea
    id: tried
    attributes:
      label: What you have tried

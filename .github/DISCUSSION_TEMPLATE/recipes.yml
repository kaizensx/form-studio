labels: ["area:recipes"]
body:
  - type: markdown
    attributes:
      value: |
        Talk about a recipe: one you want, one you are writing, or one from the
        [community gallery](https://kaizensx.github.io/form-studio/recipes/). The contribution format is in
        [community/recipes](https://github.com/kaizensx/form-studio/tree/main/community/recipes).
  - type: input
    id: recipe
    attributes:
      label: Recipe
      placeholder: "cable-clip, or a new idea"
    validations:
      required: true
  - type: textarea
    id: body
    attributes:
      label: Details
      description: Parameters, a sketch, what you printed, or what you would change.
    validations:
      required: true

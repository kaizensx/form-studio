[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "form-studio"
version = "1.1.0rc4"
description = "Desktop app, engine and MCP server for designing 3D-printable parts with an AI agent: real CAD, real slicing and an honest evidence record."
readme = "README.md"
# Form Studio is MIT. Shipped with it, under their own licences: form/recon/cadfit (CADFit, CC BY-NC 4.0, included
# with its author's permission), the exemplars ported from CADEvolve (Apache-2.0), the interface fonts (OFL-1.1),
# Lucide icons (ISC) and three.js (MIT). packaging/form.spec ships the same licence files in the app.
license = "MIT AND CC-BY-NC-4.0 AND Apache-2.0 AND OFL-1.1 AND ISC"
license-files = [
  "LICENSE",
  "form/recon/cadfit/LICENSE",
  "form/recon/cadfit/PERMISSION.md",
  "form/exemplars/LICENSE-CADEvolve",
  "form/app/assets/fonts/*LICENSE*",
  "form/fonts/*LICENSE*",
  "form/web/vendor/THREE_LICENSE",
]
requires-python = ">=3.12,<3.13"
keywords = ["3d-printing", "cad", "mcp", "build123d", "slicer", "agents"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "build123d==0.13.0",
  "numpy>=2",
  "pillow>=10.1",
  "mcp>=2.3,<3",
  "pypdfium2>=4.30",
]

[project.optional-dependencies]
app = ["PySide6>=6.9,<7"]
all = ["form-studio[app,parts,organic]"]
organic = ["manifold3d>=3.0"]  # form.meshbody: exact booleans on sculpted mesh bodies (wheels for macOS, Windows, Linux)
parts = ["bd_warehouse==0.4.0", "py_gearworks==0.0.24"]  # form.parts: fasteners, threads, bearings, gears
# form.recon.cadfit: CADFit as a mesh-to-CAD candidate ([recon] cadfit = true). Its code is CC BY-NC 4.0, included with
# its author's permission (form/recon/cadfit/PERMISSION.md); shapely and pymeshlab are used when present, never required.
cadfit = ["trimesh>=4", "manifold3d>=3.0", "scikit-learn>=1.3", "scipy>=1.13"]

[project.urls]
Homepage = "https://github.com/kaizensx/form-studio"
Issues = "https://github.com/kaizensx/form-studio/issues"
Changelog = "https://github.com/kaizensx/form-studio/blob/main/CHANGELOG.md"

[project.scripts]
form = "form.__main__:main"
form-mcp = "form.mcp_server:main"

[project.gui-scripts]
form-app = "form.app.main:main"

[tool.hatch.build.targets.wheel]
packages = ["form"]

[tool.hatch.build.targets.sdist]
exclude = ["projects", ".venv", "docs/screenshots"]

# Lint and format settings for ruff (run by .pre-commit-config.yaml and .github/workflows/quality.yml).
# The rule set starts with what is always a bug (syntax errors, undefined names, misused comparisons) so the tree is
# clean today; more rules are switched on one at a time, each in its own change, as the code is brought up to them.
[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["site/vendor", "tests/fixtures", "projects"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.format]
# Not yet applied to the whole tree: CI checks the format of the Python files a pull request changes, as advice.
docstring-code-format = true

[tool.coverage.run]
source = ["form"]
parallel = true
concurrency = ["thread", "multiprocessing"]
patch = ["subprocess"]
omit = ["form/app/*"]

[tool.coverage.report]
skip_empty = true
precision = 1
show_missing = false

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "form-studio"
version = "12.3.0"
description = "Desktop app, engine and MCP server for designing 3D-printable parts with an AI agent: real CAD, real slicing and an honest evidence record."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
keywords = ["3d-printing", "cad", "mcp", "build123d", "slicer", "agents"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "build123d==0.13.0",
  "numpy>=2",
  "pillow>=10.1",
  "mcp>=2.3,<3",
  "pypdfium2>=4.30",
]

[project.optional-dependencies]
app = ["PySide6>=6.9,<7"]
all = ["form-studio[app,parts]"]
parts = ["bd_warehouse==0.4.0", "py_gearworks==0.0.24"]  # form.parts: fasteners, threads, bearings, gears

[project.urls]
Homepage = "https://github.com/kaizensx/form-studio"
Issues = "https://github.com/kaizensx/form-studio/issues"
Changelog = "https://github.com/kaizensx/form-studio/blob/main/CHANGELOG.md"

[project.scripts]
form = "form.__main__:main"
form-mcp = "form.mcp_server:main"

[project.gui-scripts]
form-app = "form.app.main:main"

[tool.hatch.build.targets.wheel]
packages = ["form"]

[tool.hatch.build.targets.sdist]
exclude = ["projects", ".venv", "docs/screenshots"]

<rect width="760" height="556" rx="12" fill="#1c1b19"/>
<circle cx="22" cy="22" r="6" fill="#e24d26"/><circle cx="42" cy="22" r="6" fill="#e8b35a"/><circle cx="62" cy="22" r="6" fill="#9fd3a6"/>
<text x="736" y="27" text-anchor="end" fill="#9a968c" style="font-size:12px">claude code · FORM over MCP · real session, trimmed</text>
<text class="l0" x="24" y="58" fill="#f4f1ea">&gt; I measured my phone with calipers: 75.6 mm wide, 8.4 mm thick</text>
<text class="l1" x="24" y="79" fill="#f4f1ea">  with the case. Make me a desk dock and tell me if it's ready.</text>
<text class="l2" x="24" y="100" fill="#000"></text>
<text class="l3" x="24" y="121" fill="#9fd3a6"><tspan fill="#e24d26">● </tspan>form_overview</text>
<text class="l4" x="24" y="142" fill="#9a968c">  build123d 0.13.0 / OCP 8.0.1.1 · Bambu Studio 02.09.01.70 · A1 mini</text>
<text class="l5" x="24" y="163" fill="#9fd3a6"><tspan fill="#e24d26">● </tspan>describe_recipe dock</text>
<text class="l6" x="24" y="184" fill="#9a968c">  20 parameters (mm, deg, g) · 6 features · fit: pocket &lt;-&gt; device</text>
<text class="l7" x="24" y="205" fill="#9fd3a6"><tspan fill="#e24d26">● </tspan>create_project "Desk phone dock"</text>
<text class="l8" x="24" y="226" fill="#9fd3a6"><tspan fill="#e24d26">● </tspan>preview_change device_width=75.6 device_thickness=8.4</text>
<text class="l9" x="24" y="247" fill="#9a968c">  Pocket resized · Solid, STEP+STL, Checks, Slice would go stale</text>
<text class="l10" x="24" y="268" fill="#9fd3a6"><tspan fill="#e24d26">● </tspan>commit_change expect_head=1 provenance=measured (calipers)</text>
<text class="l11" x="24" y="289" fill="#9a968c">  r02 · solid 0.33 s · exports · checks · slice done</text>
<text class="l12" x="24" y="310" fill="#9fd3a6"><tspan fill="#e24d26">● </tspan>render view=sheet</text>
<text class="l13" x="24" y="331" fill="#c9a26b">  [image: four views, coloured by feature]</text>
<text class="l14" x="24" y="352" fill="#9fd3a6"><tspan fill="#e24d26">● </tspan>request_release</text>
<text class="l15" x="24" y="373" fill="#e8b35a">  ready · acknowledge: tip-over resistance 0.75 N (model)</text>
<text class="l16" x="24" y="394" fill="#000"></text>
<text class="l17" x="24" y="415" fill="#f4f1ea">Nearly ready. Pocket 76.1 x 8.9 mm, 0.25 mm per side.</text>
<text class="l18" x="24" y="436" fill="#f4f1ea">Slice: 94 min, 57.6 g, no supports (simulated, not a print).</text>
<text class="l19" x="24" y="457" fill="#f4f1ea">Tip-over uses a default phone height and mass. Tell me yours.</text>
<text class="l20" x="24" y="478" fill="#f4f1ea">I can't approve it. Review it on the bench:</text>
<text class="l21" x="24" y="499" fill="#ff8a5c">http://127.0.0.1:4174/#p=desk-phone-dock&amp;tab=release</text>
</svg>

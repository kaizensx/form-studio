# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Automated pull request review. Balanced feedback, no nitpicks, nothing written into the pull request's own
# description: the summary and walkthrough stay in the review comment.
language: en-US
tone_instructions: >-
  Be concise and specific. Point to the file and line, say what breaks and why, and suggest the smallest fix.
  Skip style comments that ruff or the pre-commit hooks already cover.
early_access: false

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: false            # never edit the pull request description
  high_level_summary_in_walkthrough: true
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: false
  estimate_code_review_effort: false
  related_issues: true
  related_prs: true
  poem: false
  in_progress_fortune: false
  review_status: true
  review_details: false
  commit_status: true
  fail_commit_status: false
  suggested_labels: false
  auto_apply_labels: false
  suggested_reviewers: false
  auto_assign_reviewers: false
  enable_prompt_for_ai_agents: false
  abort_on_close: true

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    base_branches: ["dev", "main"]
    ignore_usernames: ["dependabot[bot]"]

  pre_merge_checks:
    title:
      mode: "off"
    description:
      mode: "off"

  path_filters:
    - "!site/vendor/**"
    - "!docs/assets/**"
    - "!docs/images/**"
    - "!docs/readme/**"
    - "!docs/MCP.md"                   # generated by scripts/gen_mcp_docs.py
    - "!docs/ACCEPTANCE_RUN.md"        # generated by scripts/acceptance.py
    - "!docs/RECON_BENCH.md"           # generated by scripts/recon_bench.py
    - "!site/recipes/index.json"       # generated by site/tools/build_recipe_index.py
    - "!scripts/ci/fixtures/**"
    - "!tests/fixtures/**"
    - "!requirements.lock"
    - "!brand/**"
    - "!**/*.svg"
    - "!**/*.png"
    - "!**/*.webp"
    - "!**/*.jpg"
    - "!**/*.stl"
    - "!**/*.step"
    - "!**/*.3mf"

  path_instructions:
    - path: "form/**/*.py"
      instructions: >-
        The CAD kernel (OCCT, build123d) may only be imported in the worker process (form/worker.py); the MCP
        server, the app's engine and the CLI must stay importable without it. Project mutations must hold
        Studio.lock(pid). An artifact is current only when it exists under the key Studio.keys computes from the
        head revision's inputs; flag any input that affects an output but is missing from that key. Units are mm,
        degrees and grams. Never mark a value as measured, or a physical result as recorded, without a person's input.
    - path: "form/recipes/**/*.py"
      instructions: >-
        Recipes subclass Recipe with typed Params, ordered Stages named after Features, and constraints() that
        return RecipeErrors naming a feature, the parameters involved and a hint. Check that defaults build.
    - path: "form/mcp_server.py"
      instructions: >-
        No MCP tool may approve a release, start a print or upload a file. A change to a tool's name or arguments is
        a breaking change (MAJOR version) and needs docs/MCP.md regenerated.
    - path: "form/app/qml/**"
      instructions: >-
        Qt Quick (QML) desktop interface. Check bindings for loops, missing null checks on models and hard-coded
        sizes that break at other scale factors. The app must stay native: no web views for core interface.
    - path: ".github/workflows/**"
      instructions: >-
        Every action must be pinned to a full commit SHA with a version comment. Default to `permissions: {}` and
        grant per job. Checkouts use persist-credentials: false unless a later step pushes. pull_request_target and
        workflow_run jobs must never check out or run code from the pull request. Untrusted event fields go through
        env, never straight into run: scripts.
    - path: "site/**"
      instructions: >-
        Static website with no build framework. Check accessibility (alt text, contrast, keyboard focus), page
        weight and that nothing loads from a third-party origin without need.
    - path: "**/*.md"
      instructions: >-
        Professional, plain English. Flag only factual errors, broken links or commands that would not work; do not
        comment on wording preferences.

  tools:
    ruff:
      enabled: true
    actionlint:
      enabled: true
    shellcheck:
      enabled: true
    zizmor:
      enabled: true
    yamllint:
      enabled: true
    gitleaks:
      enabled: true
    osvScanner:
      enabled: true
    markdownlint:
      enabled: false
    languagetool:
      enabled: false
    pylint:
      enabled: false
    flake8:
      enabled: false
    github-checks:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  opt_out: false
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "docs/RELEASING.md"

# Bend allowance: the K-factor (where the neutral fibre lies, as a fraction of the thickness from the inside of the
# bend) and the default inside radius, each with the page it was read from and the date it was read. A shop's own
# K-factor replaces these and is then recorded as "specified".
#
# Bend allowance BA = θ · (r + K · t)   (θ the bend angle in radians, r the inside radius, t the thickness)
# The flat length of a bent part is the sum of its straight flats plus one BA per bend.

[[source]]
id = "wikipedia-bending"
title = "Bending (metalworking), section K-factor, table Generic K-factors"
publisher = "Wikipedia"
url = "https://en.wikipedia.org/wiki/Bending_(metalworking)"
published = "last edited 2026-09-06"
read = "2026-11-28"
note = "The page calls the table a rule of thumb (\"Actual results may vary remarkably\") and gives no primary source for it. The K-factor formula next to it cites Diegel, O., BendWorks (2002). The same table appears in METU's MECH 114 course notes, Sheet Metal Work."

[[source]]
id = "din6935-cadde"
title = "Blech biegen (DIN 6935 correction factor and developed length, as reproduced)"
publisher = "cad.de forum upload (Lenzcad), a secondary source; DIN 6935 itself (Beuth/DIN Media) was not read"
url = "https://ww3.cad.de/foren/ubb/uploads/Lenzcad/Blechbiegen.pdf"
published = "undated"
read = "2026-11-28"
note = "Gives k = 0.65 + 0.5·log10(r/t) with k on the ISO/DIN scale (0 inside, 1 mid-plane, 2 outside), i.e. K = k / 2 on the scale used here, and L_bend = (r + t·k/2)·π·α/180°. It states no range of r/t for the formula."

[[source]]
id = "fractory-bending"
title = "Sheet Metal Bending – Methods, Design Tips & K Factor"
publisher = "Fractory (Andreas Velling)"
url = "https://fractory.com/sheet-metal-bending/"
published = "2019-02-11, updated 2026-09-21"
read = "2026-11-28"

[[source]]
id = "protolabs-sheet"
title = "Sheet Metal Fabrication: Design Guidelines"
publisher = "Protolabs"
url = "https://www.protolabs.com/services/sheet-metal-fabrication/design-guidelines/"
published = "undated"

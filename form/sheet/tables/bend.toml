# ---- K-factor by method -------------------------------------------------------------------------------------

[kfactor]
default = "table"
methods = ["table", "din6935", "value"]

# The generic table: by forming (air bending, bottoming, coining), by the class of the material (soft, medium,
# hard) and by r/t: up to 1, 1 to 3, over 3. Rows exactly as the source prints them.
[kfactor.table]
source = "wikipedia-bending"
bands = [1.0, 3.0]      # r/t ≤ 1, 1 < r/t ≤ 3, r/t > 3 (the source: "0 to thickness", "thickness to 3 × thickness", "greater than 3 × thickness")
air = { soft = [0.33, 0.40, 0.50], medium = [0.38, 0.43, 0.50], hard = [0.40, 0.45, 0.50] }
bottoming = { soft = [0.42, 0.46, 0.50], medium = [0.44, 0.47, 0.50], hard = [0.46, 0.48, 0.50] }
coining = { soft = [0.38, 0.44, 0.50], medium = [0.41, 0.46, 0.50], hard = [0.44, 0.47, 0.50] }

[kfactor.din6935]
source = "din6935-cadde"
formula = "K = (0.65 + 0.5 * log10(r / t)) / 2"
# The source gives no range. Form Studio keeps K between 0 and 0.5 (the inside face and the mid-plane): a cap that
# is plain geometry for the lower end and Form Studio's choice (unsourced) for the upper end.
cap = [0.0, 0.5]
cap_source = "unsourced"

# ---- materials ----------------------------------------------------------------------------------------------
# class: which column of the generic table a material reads. The table's columns are "soft", "medium" and "hard"
# with no alloy named; the class given here is Form Studio's reading (assumed), shown as such on every result.
# r_default: the inside radius a flange gets when none is given: equal to the thickness, after Fractory ("choosing
# the inner radius (ir) to be the same as the material thickness").

[[material]]
id = "al_5052_h32"
label = "Aluminium 5052-H32"
class = "soft"
class_source = "assumed"
r_default = "t"
r_source = "fractory-bending"


# SendCutSend's published materials, thicknesses and limits, as read from their pages on 2026-11-28. Form Studio
# checks a part against this table before a person sends it anywhere; it never uploads or orders. The pages carry
# no publication date; a table read more than 90 days ago says so on every result. Values the pages contradict are
# not used (see max_flat below).

[service]
id = "sendcutsend"
label = "SendCutSend"
url = "https://sendcutsend.com"
read = "2026-11-28"
note = "Laser cutting and bending. Per-material minimum hole-to-edge and bridge values are listed on their material pages in a spec table those pages load on demand; it was not read, so those rules are not checked."

[[source]]
id = "scs-guidelines"
title = "How to prepare your file for sheet cutting (Sheet Cutting Guidelines)"

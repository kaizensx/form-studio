[limits]
thickness_match_mm = 0.02          # a thickness matches a listed one within this (Form Studio's tolerance, unsourced)
laser_min_hole = 0.5               # × t
laser_min_hole_source = "scs-guidelines"
laser_min_hole_quote = "Minimum hole/cutout size (laser): At least 50% of material thickness"
bend_min_flat_in = [0.375, 1.5]
bend_max_flat_in = [30.0, 44.0]
bend_flat_source = "scs-bending"
bend_flat_quote = "Min flat part size: .375″ x 1.5″ ... Max flat part size: 30″ x 44″"
bend_max_angle = 130.0
bend_angle_source = "scs-bending"
bend_angle_quote = "Max Bend Angle 130°"
radius_note = "Bend radius and K factor are set per material thickness ... we don't offer custom bend radii"
radius_source = "scs-bending"
box_note = "we're unable to form boxes that close in on themselves"
max_flat_note = "The 5052 page gives 44 × 68 in (instant) and 59 × 119 in (custom) in its spec section and 30 × 44 in (instant) and 30 × 56 in (custom) in its FAQ; the limit for flat parts is not checked until the pages agree."

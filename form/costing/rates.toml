# Rates for the cost models (form/costing). Every number here is one of two kinds:
#
#   sourced   a published number: a statistics office, a vendor's public price page, a peer-reviewed paper or a
#             textbook. `source` names an entry below; `quote` is the sentence or table cell that states it, and
#             `applies` is the period or date the number is for. All pages were read on 2026-11-28.
#   assumed   no source states it. Only process parameters are assumed (times, build rates, a machine's life in
#             hours, fractions); a price or an hourly rate (money) is never assumed here. A money rate with no source
#             has no value: the cost line that needs it is left out and says what to set.
#
# Money is in the currency it was published in. It is converted only with a stated rate: the ECB reference rate
# below, or a rate the person sets for their shop. Vendor prices change; each says when it was read.
# The person overrides any rate per shop in Settings > Costs (or `form cost rates --set id=value`); an override is
# "specified" (the person's number), never "sourced".

version = 1
read = "2026-11-28"


# Cutting speeds and chip loads for carbide end mills, each read from the page it names.
#
# A material row is the source's own row: its surface speed range in feet per minute (sfm) and its chip load in inches
# per tooth for each cutter diameter the source lists (chipload_in, keyed by the diameter in inches). Nothing here is
# interpolated by hand: form/cam/feeds.py interpolates between the listed diameters and says so.
#
# What no source here covers is not in this file: drills, chamfer mills, wood and sheet goods, plunge feeds, depths
# of cut and stepovers. For those the plan uses the person's numbers, or a stated rule of thumb marked "assumed",
# and a program with an assumed speed or feed cannot be released.

[sources.harvey_gmg]
title = "General Machining Guidelines"
publisher = "Harvey Tool"
url = "https://www.harveytool.com/resources/general-machining-guidelines"
published = "undated"
read = "2026-11-28"
formula = "RPM = (3.82 x SFM) / D; IPM = RPM x IPT x T"
note = "Tables “Carbide End Mills, Non-Ferrous” and “Carbide End Mills, Iron, Steel, Stainless”: SFM range and chip load (IPT) by cutter diameter."


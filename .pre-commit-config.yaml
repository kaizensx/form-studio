# Checks that run before a commit (`pre-commit install`) and in CI on the files a pull request changes
# (.github/workflows/quality.yml). Run them on everything with `pre-commit run --all-files`.
# Hook versions are pinned by commit; `pre-commit autoupdate --freeze` moves them.
minimum_pre_commit_version: "3.5.0"
default_install_hook_types: [pre-commit]
exclude: ^(site/vendor/|tests/fixtures/|docs/assets/|brand/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        # --enforce-all: CI passes the changed files, which are committed, not staged
        args: [--maxkb=2048, --enforce-all]
        # two app recordings regenerated by scripts/make_app_media.py are larger on purpose
        exclude: ^docs/images/(app-orbit|print-sim-play)\.webp$
      - id: end-of-file-fixer
        exclude: ^(scripts/ci/fixtures/|site/assets/data/)   # generated JSON, compared byte for byte
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 9026c9127e153371d7a78dfcb0c45ae2046a3d10  # frozen: v0.17.6
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 0eb9e4a60caf04df64b499ed1e8bef55f4440eae  # frozen: v1.33.0
    hooks:
      - id: zizmor
        args: [--offline]
